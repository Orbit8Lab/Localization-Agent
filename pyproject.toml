[project]
name = "orbit8-agent"
version = "0.1.0"
description = "Orbit8 localization agent — LangGraph stage executors under a deterministic Job Controller (8 stages / 6 gates)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "pydantic>=2.7",
    "openai>=1.40",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The HTTP surface is optional: the CLI and the test suite must stay
# runnable without a web stack installed.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
# Anthropic speaks its own wire protocol rather than the OpenAI-compatible
# one every other provider shares, so it needs its own SDK. Optional: the
# import is lazy and no other provider depends on it.
anthropic = ["anthropic>=0.40"]
# Reference-based MT metrics for the IAAI evaluation only. Optional
# because nothing in the pipeline computes them: they score against a
# human reference, and this project's quality standard is the client's
# glossary and style rules, which BLEU cannot see. Kept out of the core
# so a deployment never carries an evaluation-only dependency.
metrics = ["sacrebleu>=2.4"]

[project.scripts]
orbit8 = "orbit8.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "orbit8"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
