<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="60" y="80" font-size="38" font-weight="700" fill="#1f2937">The critic finds defects. Code decides when to stop.</text>

  <!-- main chain -->
  <g text-anchor="middle">
    <rect x="60" y="180" width="200" height="100" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
    <text x="160" y="228" font-size="22" font-weight="700" fill="#334155">TM reuse</text>
    <text x="160" y="256" font-size="18" fill="#64748b">free hits</text>

    <rect x="320" y="180" width="200" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="420" y="228" font-size="22" font-weight="700" fill="#1d4ed8">TRANSLATE</text>
    <text x="420" y="256" font-size="18" fill="#1e3a8a">LLM</text>

    <rect x="580" y="180" width="200" height="100" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="680" y="228" font-size="22" font-weight="700" fill="#047857">GATE</text>
    <text x="680" y="256" font-size="18" fill="#064e3b">code, no LLM</text>

    <rect x="840" y="180" width="200" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="940" y="228" font-size="22" font-weight="700" fill="#1d4ed8">CRITIC</text>
    <text x="940" y="256" font-size="18" fill="#1e3a8a">LLM</text>
  </g>

  <g stroke="#475569" stroke-width="3">
    <line x1="260" y1="230" x2="320" y2="230" marker-end="url(#t1)"/>
    <line x1="520" y1="230" x2="580" y2="230" marker-end="url(#t1)"/>
    <line x1="780" y1="230" x2="840" y2="230" marker-end="url(#t1)"/>
  </g>

  <!-- route -->
  <rect x="840" y="360" width="200" height="100" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="940" y="408" font-size="22" font-weight="700" text-anchor="middle" fill="#047857">ROUTE</text>
  <text x="940" y="436" font-size="18" text-anchor="middle" fill="#064e3b">code decides</text>

  <line x1="940" y1="280" x2="940" y2="360" stroke="#475569" stroke-width="3" marker-end="url(#t1)"/>

  <!-- repair loop back -->
  <path d="M 840 410 C 600 410 420 380 420 280" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#t2)"/>
  <text x="620" y="440" font-size="21" text-anchor="middle" fill="#dc2626">repair</text>

  <!-- exits -->
  <line x1="900" y1="460" x2="820" y2="520" stroke="#475569" stroke-width="3" marker-end="url(#t1)"/>

  <rect x="240" y="520" width="560" height="120" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="272" y="570" font-size="22" font-weight="700" fill="#b45309">Three hard stops — none the model's call:</text>
  <text x="272" y="612" font-size="21" fill="#78350f">ratchet · convergence · iteration + token cap</text>

  <text x="840" y="590" font-size="24" font-weight="700" fill="#1f2937">Cost has</text>
  <text x="840" y="624" font-size="24" font-weight="700" fill="#1f2937">a ceiling.</text>
</svg>
