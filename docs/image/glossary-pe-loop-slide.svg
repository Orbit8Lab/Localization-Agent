<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="60" y="80" font-size="38" font-weight="700" fill="#1f2937">Every human decision becomes a machine rule</text>

  <!-- top row -->
  <g text-anchor="middle">
    <rect x="60" y="150" width="290" height="110" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
    <text x="205" y="218" font-size="24" font-weight="700" fill="#334155">CORPUS</text>

    <rect x="455" y="150" width="290" height="110" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="600" y="205" font-size="24" font-weight="700" fill="#047857">EXTRACT</text>
    <text x="600" y="238" font-size="20" fill="#064e3b">candidates</text>

    <rect x="850" y="150" width="290" height="110" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="995" y="205" font-size="24" font-weight="700" fill="#b45309">HUMAN</text>
    <text x="995" y="238" font-size="20" fill="#78350f">one row per term</text>
  </g>

  <!-- bottom row -->
  <g text-anchor="middle">
    <rect x="850" y="410" width="290" height="110" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
    <text x="995" y="465" font-size="24" font-weight="700" fill="#334155">LEDGER</text>
    <text x="995" y="498" font-size="20" fill="#64748b">locked decisions</text>

    <rect x="455" y="410" width="290" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="600" y="465" font-size="24" font-weight="700" fill="#1d4ed8">TRANSLATE</text>
    <text x="600" y="498" font-size="20" fill="#1e3a8a">glossary in prompt</text>

    <rect x="60" y="410" width="290" height="110" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="205" y="465" font-size="24" font-weight="700" fill="#047857">GATE</text>
    <text x="205" y="498" font-size="20" fill="#064e3b">code re-checks</text>
  </g>

  <!-- arrows -->
  <line x1="350" y1="205" x2="455" y2="205" stroke="#475569" stroke-width="3" marker-end="url(#g1)"/>
  <line x1="745" y1="205" x2="850" y2="205" stroke="#475569" stroke-width="3" marker-end="url(#g1)"/>
  <line x1="995" y1="260" x2="995" y2="410" stroke="#475569" stroke-width="3" marker-end="url(#g1)"/>
  <line x1="850" y1="465" x2="745" y2="465" stroke="#475569" stroke-width="3" marker-end="url(#g1)"/>
  <line x1="455" y1="465" x2="350" y2="465" stroke="#475569" stroke-width="3" marker-end="url(#g1)"/>
  <path d="M 205 410 C 205 330 205 290 205 260" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#g1)"/>

  <text x="238" y="345" font-size="20" fill="#64748b">next drop:</text>
  <text x="238" y="372" font-size="20" fill="#64748b">only the delta asks</text>

  <text x="60" y="600" font-size="24" font-weight="600" fill="#1f2937">The same terminology question is never asked twice.</text>
</svg>
