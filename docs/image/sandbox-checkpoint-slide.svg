<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="60" y="80" font-size="38" font-weight="700" fill="#1f2937">One engine, one sandbox per client</text>

  <!-- Sandbox A -->
  <rect x="60" y="140" width="520" height="330" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="92" y="192" font-size="26" font-weight="700" fill="#334155">Client A</text>

  <g text-anchor="middle">
    <rect x="92" y="222" width="140" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="162" y="265" font-size="20" fill="#047857">own TM</text>

    <rect x="252" y="222" width="140" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="322" y="265" font-size="20" fill="#047857">own glossary</text>

    <rect x="412" y="222" width="136" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="480" y="265" font-size="20" fill="#047857">own gates</text>
  </g>

  <text x="92" y="348" font-size="22" fill="#334155">● every stage output is a checkpoint</text>
  <text x="92" y="392" font-size="22" fill="#334155">● pause · crash · resume · hand off</text>
  <text x="92" y="436" font-size="22" fill="#334155">● nothing is ever overwritten</text>

  <!-- Sandbox B -->
  <rect x="620" y="140" width="520" height="330" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="652" y="192" font-size="26" font-weight="700" fill="#334155">Client B</text>

  <g text-anchor="middle">
    <rect x="652" y="222" width="140" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="722" y="265" font-size="20" fill="#1d4ed8">own TM</text>

    <rect x="812" y="222" width="140" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="882" y="265" font-size="20" fill="#1d4ed8">own glossary</text>

    <rect x="972" y="222" width="136" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="1040" y="265" font-size="20" fill="#1d4ed8">own gates</text>
  </g>

  <text x="652" y="348" font-size="22" fill="#334155">● different languages</text>
  <text x="652" y="392" font-size="22" fill="#334155">● different process</text>
  <text x="652" y="436" font-size="22" fill="#334155">● zero cross-contamination</text>

  <text x="60" y="562" font-size="24" font-weight="600" fill="#1f2937">The contract lives in the sandbox, never in the code —</text>
  <text x="60" y="600" font-size="24" font-weight="600" fill="#1f2937">so a bespoke client process is configuration, not re-engineering.</text>
</svg>
