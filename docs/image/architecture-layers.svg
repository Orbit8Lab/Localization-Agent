<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="48" y="56" font-size="30" font-weight="700" fill="#1f2937">Judgment vs. Control — the three layers</text>
  <text x="48" y="86" font-size="17" fill="#6b7280">LLMs propose · deterministic code disposes · humans decide</text>

  <!-- Human band -->
  <rect x="48" y="116" width="860" height="130" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="72" y="152" font-size="21" font-weight="700" fill="#b45309">HUMANS — decide</text>
  <text x="72" y="182" font-size="16" fill="#78350f">Gate approvals G0–G5 recorded as data · standard PE forms with fixed decision vocabulary</text>
  <text x="72" y="208" font-size="16" fill="#78350f">Incomplete decisions are reported, never guessed · humans see decisions, not corpora</text>
  <g>
    <rect x="700" y="130" width="180" height="34" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="790" y="152" font-size="14" text-anchor="middle" fill="#b45309">MTPE / LQA / Glossary forms</text>
    <rect x="700" y="172" width="180" height="34" rx="8" fill="#ffffff" stroke="#d97706"/>
    <text x="790" y="194" font-size="14" text-anchor="middle" fill="#b45309">G0–G5 gate ledger</text>
  </g>

  <!-- Control band -->
  <rect x="48" y="278" width="860" height="150" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="72" y="314" font-size="21" font-weight="700" fill="#047857">DETERMINISTIC CONTROL PLANE</text>
  <text x="72" y="344" font-size="16" fill="#064e3b">Job Controller — derives pipeline state from artifacts on disk, never from model claims</text>
  <text x="72" y="370" font-size="16" fill="#064e3b">LangGraph stage executors — code nodes route, gate, verify; defect loops re-enter surgically</text>
  <text x="72" y="396" font-size="16" fill="#064e3b">Schema police — every agent output validates against a strict envelope or is rejected</text>

  <!-- Agent band -->
  <rect x="48" y="460" width="860" height="150" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="72" y="496" font-size="21" font-weight="700" fill="#1d4ed8">LLM AGENTS — stateless judgment</text>
  <g font-size="15" fill="#1e3a8a">
    <rect x="72" y="516" width="150" height="36" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="147" y="539" text-anchor="middle">Translator</text>
    <rect x="238" y="516" width="150" height="36" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="313" y="539" text-anchor="middle">Critic / LQA T3</text>
    <rect x="404" y="516" width="150" height="36" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="479" y="539" text-anchor="middle">Repair</text>
    <rect x="570" y="516" width="150" height="36" rx="8" fill="#ffffff" stroke="#2563eb"/><text x="645" y="539" text-anchor="middle">Terminologist</text>
  </g>
  <text x="72" y="586" font-size="15" fill="#1e40af">no filesystem · no memory · no write path · model fingerprint stamped on every output</text>

  <!-- Artifact spine -->
  <rect x="952" y="116" width="200" height="494" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="1052" y="152" font-size="19" font-weight="700" text-anchor="middle" fill="#334155">ARTIFACT TREE</text>
  <text x="1052" y="176" font-size="14" text-anchor="middle" fill="#64748b">the only state</text>
  <g font-size="13.5" fill="#475569" text-anchor="middle">
    <rect x="972" y="196" width="160" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="1052" y="216">s0/intake.json</text>
    <rect x="972" y="234" width="160" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="1052" y="254">s3/glossary.v1.json</text>
    <rect x="972" y="272" width="160" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="1052" y="292">s4/attempt-02/…</text>
    <rect x="972" y="310" width="160" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="1052" y="330">s5/lqa_report.json</text>
    <rect x="972" y="348" width="160" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="1052" y="368">runs/&lt;locale&gt;.db</text>
    <rect x="972" y="386" width="160" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="1052" y="406">assets/tm.db</text>
  </g>
  <text x="1052" y="452" font-size="13.5" text-anchor="middle" fill="#64748b">schema-versioned</text>
  <text x="1052" y="472" font-size="13.5" text-anchor="middle" fill="#64748b">attempt-versioned</text>
  <text x="1052" y="492" font-size="13.5" text-anchor="middle" fill="#64748b">audit-stamped</text>
  <text x="1052" y="540" font-size="14.5" font-weight="600" text-anchor="middle" fill="#334155">"a missing tool is a</text>
  <text x="1052" y="560" font-size="14.5" font-weight="600" text-anchor="middle" fill="#334155">guarantee; a prompt rule</text>
  <text x="1052" y="580" font-size="14.5" font-weight="600" text-anchor="middle" fill="#334155">is only a suggestion"</text>

  <!-- arrows -->
  <line x1="478" y1="246" x2="478" y2="278" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="440" y1="460" x2="440" y2="428" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="516" y1="428" x2="516" y2="460" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="530" y="449" font-size="13.5" fill="#64748b">prompt + glossary slice ↓ / JSON or rejected ↑</text>
  <text x="345" y="267" font-size="13.5" fill="#64748b">approve gates · fill forms</text>
  <line x1="908" y1="353" x2="952" y2="353" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="930" y="341" font-size="13" fill="#047857" text-anchor="middle">writes</text>
</svg>
