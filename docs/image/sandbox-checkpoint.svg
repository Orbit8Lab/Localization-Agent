<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="48" y="56" font-size="30" font-weight="700" fill="#1f2937">Pillar 1 · Sandbox &amp; checkpoint design</text>
  <text x="48" y="86" font-size="17" fill="#6b7280">every engagement is an isolated, resumable state machine — fit different customer needs at any time</text>

  <!-- Sandbox A -->
  <rect x="48" y="116" width="520" height="420" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="72" y="150" font-size="19" font-weight="700" fill="#334155">SANDBOX · Customer A — jobs/customer-a-en/</text>
  <text x="72" y="172" font-size="14" fill="#64748b">path-confined · own TM · own glossary · own gate config</text>

  <g font-size="15" fill="#334155">
    <rect x="72" y="192" width="130" height="40" rx="8" fill="#ecfdf5" stroke="#059669"/><text x="137" y="217" text-anchor="middle">S0 intake ✓</text>
    <rect x="216" y="192" width="130" height="40" rx="8" fill="#ecfdf5" stroke="#059669"/><text x="281" y="217" text-anchor="middle">S1 ingest ✓</text>
    <rect x="360" y="192" width="130" height="40" rx="8" fill="#ecfdf5" stroke="#059669"/><text x="425" y="217" text-anchor="middle">S3 asset ✓</text>
    <rect x="72" y="260" width="200" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="172" y="286" text-anchor="middle">S4 translate</text>
    <text x="172" y="310" text-anchor="middle" font-size="13.5" fill="#64748b">attempt-01 · attempt-02 ●</text>
    <rect x="300" y="260" width="200" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="400" y="286" text-anchor="middle">S5 LQA</text>
    <text x="400" y="310" text-anchor="middle" font-size="13.5" fill="#64748b">attempt-01 ● cascade ledger</text>
  </g>
  <path d="M 400 330 C 400 380 172 380 172 330" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="286" y="392" font-size="14" text-anchor="middle" fill="#dc2626">defect loop re-enters S4 — repair, never blind retranslate</text>

  <path d="M 120 232 C 90 380 90 420 120 440" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
  <rect x="130" y="424" width="360" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-dasharray="5 4"/>
  <text x="310" y="449" font-size="14.5" text-anchor="middle" fill="#1d4ed8">incremental drop re-enters S1 — same workspace, delta only</text>

  <text x="72" y="510" font-size="14.5" fill="#334155">● = checkpoint: artifact write. Crash, pause, or handoff —</text>
  <text x="72" y="530" font-size="14.5" fill="#334155">the Controller re-derives state from disk and resumes.</text>

  <!-- Sandbox B -->
  <rect x="616" y="116" width="536" height="250" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="640" y="150" font-size="19" font-weight="700" fill="#334155">SANDBOX · Customer B — jobs/customer-b-multi/</text>
  <text x="640" y="172" font-size="14" fill="#64748b">different languages · different gates · zero cross-contamination</text>
  <g font-size="14.5" fill="#334155">
    <rect x="640" y="192" width="230" height="38" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="755" y="216" text-anchor="middle">strict G1 glossary freeze</text>
    <rect x="886" y="192" width="240" height="38" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="1006" y="216" text-anchor="middle">client-specific QA severity map</text>
    <rect x="640" y="240" width="230" height="38" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="755" y="264" text-anchor="middle">ja / ko / ru in parallel runs</text>
    <rect x="886" y="240" width="240" height="38" rx="8" fill="#ffffff" stroke="#94a3b8"/><text x="1006" y="264" text-anchor="middle">own deliverable cadence</text>
  </g>
  <text x="640" y="322" font-size="14.5" fill="#334155">Same engine, different contract — configuration lives in the</text>
  <text x="640" y="342" font-size="14.5" fill="#334155">sandbox (job.yaml), never in the code.</text>

  <!-- takeaway -->
  <rect x="616" y="396" width="536" height="140" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="430" font-size="18" font-weight="700" fill="#b45309">Why customers care</text>
  <text x="640" y="460" font-size="15" fill="#78350f">· join at any stage: bring your own TM/glossary, we resume mid-lifecycle</text>
  <text x="640" y="486" font-size="15" fill="#78350f">· change scope mid-project: attempts version, nothing is overwritten</text>
  <text x="640" y="512" font-size="15" fill="#78350f">· audit anytime: every state transition is a file you can read</text>

  <text x="48" y="600" font-size="16.5" font-weight="600" fill="#1f2937">The pipeline is not a conveyor belt — it is a resumable state machine per customer,</text>
  <text x="48" y="624" font-size="16.5" font-weight="600" fill="#1f2937">so "we're mid-project and the client changed everything" is a normal Tuesday, not an incident.</text>
</svg>
