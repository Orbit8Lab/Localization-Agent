<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="ui-sans-serif,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="60" y="80" font-size="38" font-weight="700" fill="#1f2937">Judgment vs. control</text>

  <!-- HUMANS -->
  <rect x="60" y="140" width="700" height="120" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
  <text x="96" y="196" font-size="30" font-weight="700" fill="#b45309">HUMANS</text>
  <text x="96" y="234" font-size="22" fill="#78350f">decide — gates G0–G5</text>

  <!-- CONTROL -->
  <rect x="60" y="288" width="700" height="120" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="96" y="344" font-size="30" font-weight="700" fill="#047857">CODE</text>
  <text x="96" y="382" font-size="22" fill="#064e3b">controls — routes, gates, verifies</text>

  <!-- AGENTS -->
  <rect x="60" y="436" width="700" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="96" y="492" font-size="30" font-weight="700" fill="#1d4ed8">LLM AGENTS</text>
  <text x="96" y="530" font-size="22" fill="#1e3a8a">judge — translate, critique, adjudicate</text>

  <!-- ARTIFACTS spine -->
  <rect x="820" y="140" width="320" height="416" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="980" y="316" font-size="30" font-weight="700" text-anchor="middle" fill="#334155">ARTIFACTS</text>
  <text x="980" y="356" font-size="22" text-anchor="middle" fill="#64748b">the only state</text>

  <line x1="760" y1="348" x2="820" y2="348" stroke="#64748b" stroke-width="3" marker-end="url(#a1)"/>

  <text x="60" y="626" font-size="24" font-weight="600" fill="#1f2937">A missing tool is a guarantee. A prompt rule is only a suggestion.</text>
</svg>
